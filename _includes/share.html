{% assign share_url = site.url | append: page.url %}
{% assign share_title = page.title | url_encode %}
{% assign share_url_enc = share_url | url_encode %}
<nav class="share-nav" aria-label="Compartilhar">
  <span class="share-label">
    <span class="lang-pt">Compartilhar</span>
    <span class="lang-en">Share</span>
  </span>
  <ul class="share">
    <li>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url_enc }}" rel="nofollow noopener" target="_blank" title="Compartilhar no LinkedIn" aria-label="Compartilhar no LinkedIn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M19 3A2 2 0 0 1 21 5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 18V9.75H5.67V18h2.67zM7 8.58a1.55 1.55 0 1 0 0-3.1 1.55 1.55 0 0 0 0 3.1zM18.34 18v-4.52c0-2.42-1.3-3.55-3.03-3.55-1.4 0-2.02.77-2.37 1.31V9.75h-2.67c.04.76 0 8.25 0 8.25h2.67v-4.61c0-.24.02-.48.09-.65.2-.48.63-.97 1.38-.97.97 0 1.36.74 1.36 1.82V18h2.57z"/></svg>
      </a>
    </li>
    <li>
      <a href="https://twitter.com/intent/tweet?text={{ share_title }}&url={{ share_url_enc }}" rel="nofollow noopener" target="_blank" title="Compartilhar no X" aria-label="Compartilhar no X">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.16 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
    </li>
    <li>
      <a href="https://www.reddit.com/submit?url={{ share_url_enc }}&title={{ share_title }}" rel="nofollow noopener" target="_blank" title="Compartilhar no Reddit" aria-label="Compartilhar no Reddit">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M22 12.5c0-1.1-.9-2-2-2-.6 0-1.1.2-1.4.6-1.4-1-3.4-1.6-5.6-1.7l1-4.4 3 .7c0 .8.6 1.4 1.4 1.4.8 0 1.4-.6 1.4-1.4 0-.8-.6-1.4-1.4-1.4-.5 0-1 .3-1.3.7l-3.3-.7c-.1 0-.3 0-.3.1L12.5 8.9c-2.3.1-4.3.7-5.7 1.7-.4-.4-.9-.6-1.4-.6-1.1 0-2 .9-2 2 0 .8.5 1.5 1.2 1.8v.5c0 3 3.5 5.4 7.8 5.4s7.8-2.4 7.8-5.4v-.5c.7-.3 1.2-1 1.2-1.8zM7 13.8c0-.8.6-1.4 1.4-1.4.8 0 1.4.6 1.4 1.4 0 .8-.6 1.4-1.4 1.4-.8 0-1.4-.6-1.4-1.4zm8.3 3.6c-1 .6-2 .8-3.3.8s-2.4-.2-3.3-.8c-.2-.1-.3-.4-.1-.6.2-.2.4-.3.7-.1.7.5 1.6.7 2.8.7 1.1 0 2-.2 2.8-.6.2-.1.5 0 .6.2 0 .1 0 .3-.2.4zm-.2-2.2c-.8 0-1.4-.6-1.4-1.4 0-.8.6-1.4 1.4-1.4.8 0 1.4.6 1.4 1.4 0 .7-.6 1.4-1.4 1.4z"/></svg>
      </a>
    </li>
    <li>
      <a href="https://news.ycombinator.com/submitlink?u={{ share_url_enc }}&t={{ share_title }}" rel="nofollow noopener" target="_blank" title="Enviar ao Hacker News" aria-label="Enviar ao Hacker News">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M2 2h20v20H2V2zm9.03 10.18v5.34h1.94v-5.34l3.5-6.4h-2.13l-2.34 4.63-2.34-4.63H7.53l3.5 6.4z"/></svg>
      </a>
    </li>
    <li>
      <a href="#" class="share-copy-link" data-url="{{ share_url }}" title="Copiar link" aria-label="Copiar link">
        <svg class="share-icon-link" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <svg class="share-icon-check" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polyline points="20 6 9 17 4 12"/></svg>
      </a>
    </li>
  </ul>
</nav>
<script>
(function() {
  var btn = document.querySelector('.share-copy-link');
  if (!btn) return;
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    var url = btn.getAttribute('data-url');
    function flash() {
      var link  = btn.querySelector('.share-icon-link');
      var check = btn.querySelector('.share-icon-check');
      if (link)  link.style.display  = 'none';
      if (check) check.style.display = 'block';
      setTimeout(function () {
        if (link)  link.style.display  = 'block';
        if (check) check.style.display = 'none';
      }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(flash);
    } else {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      flash();
    }
  });
})();
</script>
