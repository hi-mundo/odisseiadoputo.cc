<header class="site-header" role="banner">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }} — home">
      <img src="{{ site.baseurl }}/img/logo.png" alt="" class="site-brand-logo" width="140" height="32" />
      <span class="site-brand-word">A odisseia do puto</span>
    </a>

    <button type="button" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Abrir menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Principal">
      <ul class="site-nav-list">
        <li>
          <a href="{{ site.baseurl }}/" data-pt="Início" data-en="Home">Início</a>
        </li>
        <li>
          <a href="{{ site.baseurl }}/about/" data-pt="Sobre" data-en="About">Sobre</a>
        </li>
        <li>
          <a href="{{ site.baseurl }}/apoie/" data-pt="Apoie" data-en="Support">Apoie</a>
        </li>
      </ul>

      <div class="site-nav-controls">
        <div class="lang-switcher" role="group" aria-label="Idioma / Language">
          <button type="button" class="lang-btn lang-btn-pt is-active" data-lang="pt" aria-pressed="true">PT</button>
          <span class="lang-sep" aria-hidden="true">/</span>
          <button type="button" class="lang-btn lang-btn-en" data-lang="en" aria-pressed="false">EN</button>
        </div>

        <button id="mode-toggle" class="mode-btn" type="button"
                aria-label="Alternar tema: moderno / 2003"
                title="Alternar tema">
          <svg class="mode-icon mode-icon-sun" viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="2"  x2="12" y2="5"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="2"  y1="12" x2="5"  y2="12"/>
              <line x1="19" y1="12" x2="22" y2="12"/>
              <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/>
              <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
              <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/>
              <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>
            </g>
          </svg>
          <span class="mode-icon mode-icon-crt" aria-hidden="true">💾</span>
          <span class="mode-label" data-pt="Moderno" data-en="Modern">Moderno</span>
        </button>
      </div>
    </nav>
  </div>
</header>

<script>
  // Toggle do menu mobile (hambúrguer). Inline pra evitar flash.
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var nav = document.getElementById('site-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      nav.classList.toggle('is-open', !open);
      document.body.classList.toggle('nav-open', !open);
    });
    // Fecha ao clicar em um link (SPA feel em mobile)
    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A' && nav.classList.contains('is-open')) {
        btn.setAttribute('aria-expanded', 'false');
        nav.classList.remove('is-open');
        document.body.classList.remove('nav-open');
      }
    });
  })();
</script>
