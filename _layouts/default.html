<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">

{% include head.html %}

<body>
  <span hidden>Impact-Site-Verification: 0b2dadf9-d8ff-42e0-b36f-a06abdfe6aa9</span>
  <!-- Skip link (a11y) -->
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <!-- Overlay CRT do "modo 2003" (só renderiza nada se o body não tiver .theme-2003) -->
  <div class="crt-layer" aria-hidden="true">
    <div id="fog-bg" class="fog-bg">
      <div class="fog-layer fog-layer-1"></div>
      <div class="fog-layer fog-layer-2"></div>
      <div class="fog-layer fog-layer-3"></div>
      <div class="fog-vignette"></div>
    </div>
    <div class="scanline"></div>
    <div class="crt-flicker"></div>
  </div>

  <div class="site-shell">
    {% include nav.html %}

    <main id="main" class="site-main" tabindex="-1">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>

  <script src="{{ '/js/fog.js'          | prepend: site.baseurl }}" defer></script>
  <script src="{{ '/js/filter.js'       | prepend: site.baseurl }}" defer></script>
  <script src="{{ '/js/lang-switcher.js'| prepend: site.baseurl }}" defer></script>
  <script src="{{ '/js/mode-switcher.js'| prepend: site.baseurl }}" defer></script>
</body>

</html>
